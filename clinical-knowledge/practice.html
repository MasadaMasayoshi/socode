<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看護過程の練習｜socode</title><style>body{max-width:800px;margin:auto;padding:16px;font:16px/1.7 system-ui,sans-serif;color:#1c2835;background:#f8fafc}h1{font-size:1.55rem}fieldset{background:white;border:1px solid #d1d9e3;border-radius:10px;padding:15px}label{display:block;margin:12px 0;padding:8px;border:1px solid #e2e8f0;border-radius:8px}button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid #64748b;background:white}button:focus-visible,label:focus-within{outline:2px solid #2563eb}#feedback{white-space:pre-wrap;min-height:40px}p{max-width:70ch}</style></head><body>
<a href="index.html">← 看護知識資料集</a>
<h1>看護過程の練習</h1>
<p>架空の学習事例を使ったルールベースの確認問題です。AI採点・患者の診断・医療判断には使用しません。回答履歴は直近500件をこのブラウザに保存します。患者情報は保存しません。</p>
<p id="progress" aria-live="polite"></p><details><summary>学習範囲と確認状況</summary><p>ヘンダーソン14項目の内容分類と、情報整理・根拠確認の36問です。各問題の最後の回答を集計します。臨床能力や国試全範囲の評価ではありません。</p><ul id="coverage"></ul></details><h2 id="title"></h2><p id="story"></p><form id="answer"><fieldset><legend id="prompt"></legend><div id="choices"></div></fieldset><p><button type="submit">答え合わせ</button> <button id="next" type="button">次の問題</button> <button id="reset-progress" type="button">学習履歴を消去</button></p></form><p id="feedback" role="status" aria-live="polite"></p>
<script src="practice.js"></script><script>'use strict';
const bank=window.NursingPractice;
const PROGRESS_KEY='socode-nursing-practice-v1';
function loadAttempts(){
  try{
    const saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'[]');
    const known=new Set(bank.cases.map(c=>c.id));
    return Array.isArray(saved)?saved.filter(x=>x&&known.has(x.id)&&typeof x.correct==='boolean'&&typeof x.topic==='string').slice(-500):[];
  }catch(e){return [];}
}
let attempts=loadAttempts(),active=null,answered=false;
function saveAttempts(){
  try{
    const serialized=JSON.stringify(attempts.slice(-500));
    localStorage.setItem(PROGRESS_KEY,serialized);
    return localStorage.getItem(PROGRESS_KEY)===serialized;
  }catch(e){return false;}
}
const $=id=>document.getElementById(id);
function updateProgress(){
 const summary=bank.coverage(attempts);
 $('progress').textContent='回答数 '+attempts.length+'件・既回答 '+summary.answered+'/'+summary.total+'問・最後の回答が正解 '+summary.lastCorrect+'問';
 $('coverage').replaceChildren();
 for(const group of [...summary.needs.map(n=>({...n,label:'欲求'+n.id+'：'+n.name})),{...summary.process,label:'情報整理・根拠確認'}]){
  const li=document.createElement('li');li.textContent=group.label+'：既回答 '+group.answered+'/'+group.total+'問、最後の回答が正解 '+group.lastCorrect+'問';$('coverage').append(li);
 }
}
function show(){active=bank.chooseNext(attempts);answered=false;$('feedback').textContent='';updateProgress();$('title').textContent=active.topic;$('story').textContent=active.story;$('prompt').textContent=active.prompt;$('choices').replaceChildren();
active.choices.map((option,i)=>({option,i})).sort((a,b)=>(a.i+attempts.length)%active.choices.length-(b.i+attempts.length)%active.choices.length).forEach(({option,i})=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='choice';input.value=String(i);input.required=true;label.append(input,document.createTextNode(' '+option));$('choices').append(label);});}
$('answer').addEventListener('submit',e=>{e.preventDefault();if(answered)return;const checked=document.querySelector('input[name=choice]:checked');if(!checked)return;const result=bank.grade(active.id,Number(checked.value));attempts.push({id:active.id,topic:result.topic,correct:result.correct});attempts=attempts.slice(-500);const saved=saveAttempts();answered=true;$('feedback').textContent=(result.correct?'正解。':'不正解。')+'\n'+result.reason+(saved?'':'\nこの端末に学習履歴を保存できませんでした。画面を閉じると今回の結果が失われる可能性があります。');updateProgress();});
$('next').addEventListener('click',show);
$('reset-progress').addEventListener('click',()=>{
  if(!window.confirm('この端末の学習結果を消去しますか？'))return;
  try{localStorage.removeItem(PROGRESS_KEY);if(localStorage.getItem(PROGRESS_KEY)!==null)throw Error('Progress remains');}
  catch(e){$('feedback').textContent='学習履歴を消去できませんでした。端末の保存設定を確認してください。';return;}
  attempts=[];show();
});
show();
</script></body></html>

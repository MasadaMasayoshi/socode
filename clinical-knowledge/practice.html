<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看護過程の練習｜socode</title><style>body{max-width:800px;margin:auto;padding:16px;font:16px/1.7 system-ui,sans-serif;color:#1c2835;background:#f8fafc}h1{font-size:1.55rem}fieldset{background:white;border:1px solid #d1d9e3;border-radius:10px;padding:15px}label{display:block;margin:12px 0;padding:8px;border:1px solid #e2e8f0;border-radius:8px}button{font:inherit;padding:10px 18px;border-radius:8px;border:1px solid #64748b;background:white}button:focus-visible,label:focus-within{outline:2px solid #2563eb}#feedback{white-space:pre-wrap;min-height:40px}p{max-width:70ch}</style></head><body>
<a href="index.html">← 看護知識資料集</a>
<h1>看護過程の練習</h1>
<p>架空の学習事例を使ったルールベースの確認問題です。AI採点・患者の診断・医療判断には使用しません。回答履歴はこのページを閉じると消えます。</p>
<p id="progress" aria-live="polite"></p><h2 id="title"></h2><p id="story"></p><form id="answer"><fieldset><legend id="prompt"></legend><div id="choices"></div></fieldset><p><button type="submit">答え合わせ</button> <button id="next" type="button">次の問題</button></p></form><p id="feedback" role="status" aria-live="polite"></p>
<script src="practice.js"></script><script>'use strict';
const bank=window.NursingPractice;let attempts=[],active=null,answered=false;
const $=id=>document.getElementById(id);
function show(){active=bank.chooseNext(attempts);answered=false;$('feedback').textContent='';$('progress').textContent='回答数 '+attempts.length+'件';$('title').textContent=active.topic;$('story').textContent=active.story;$('prompt').textContent=active.prompt;$('choices').replaceChildren();
active.choices.map((option,i)=>({option,i})).sort((a,b)=>(a.i+attempts.length)%active.choices.length-(b.i+attempts.length)%active.choices.length).forEach(({option,i})=>{const label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='choice';input.value=String(i);input.required=true;label.append(input,document.createTextNode(' '+option));$('choices').append(label);});}
$('answer').addEventListener('submit',e=>{e.preventDefault();if(answered)return;const checked=document.querySelector('input[name=choice]:checked');if(!checked)return;const result=bank.grade(active.id,Number(checked.value));attempts.push({topic:result.topic,correct:result.correct});answered=true;$('feedback').textContent=(result.correct?'正解。':'不正解。')+'\n'+result.reason;$('progress').textContent='回答数 '+attempts.length+'件';});
$('next').addEventListener('click',show);show();
</script></body></html>

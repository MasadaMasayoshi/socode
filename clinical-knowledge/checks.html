<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看護データ品質チェック | socode</title>
<style>body{font-family:system-ui,sans-serif;line-height:1.65;max-width:900px;margin:auto;padding:16px;color:#233042;background:#f8fafc}textarea,select,button{font:inherit;padding:9px;border:1px solid #94a3b8;border-radius:8px}textarea{box-sizing:border-box;width:100%;min-height:220px}button{cursor:pointer;background:#edf4fa}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #2563eb}pre{white-space:pre-wrap;word-break:break-word;background:white;padding:14px;border:1px solid #cbd5e1;border-radius:8px}p{max-width:75ch}@media(max-width:540px){h1{font-size:1.25rem}button,select{width:100%;margin:4px 0}textarea{min-height:160px}}</style></head><body>
<p><a href="../index.html">← socodeに戻る</a> · <a href="index.html">知識資料集</a></p>
<h1>看護データの品質チェック（非AI）</h1><p>これは手動入力したJSONを端末内で点検する試験画面です。患者を特定できる実データは入力しないでください。保存・外部送信は行いません。判断結果は警告であり、看護診断ではありません。</p>
<label for="mode">点検する種類</label>
<select id="mode">
<option value="classifyEvidence">ヘンダーソンタグの確認</option><option value="periodSatisfaction">入院前・入院後の充足</option><option value="nursingProblem">看護問題と根拠</option><option value="relationMap">関連図の接続と因果根拠</option><option value="carePlan">看護計画 OP/TP/EP</option><option value="lab">検査値と基準範囲</option><option value="ocr">OCR文字列の照合</option><option value="history">修正履歴の傾向</option><option value="applicability">知識の適用条件</option>
<optgroup label="追加の品質チェック">
<option value="traceExtraction">原文と情報カードの照合</option>
<option value="chronology">日時の順序</option><option value="assessNarrative">アセスメント文章</option>
<option value="contradiction">情報の矛盾候補</option><option value="problemPriority">看護問題の優先度の確認</option>
<option value="overlappingProblems">看護問題の重複</option><option value="crossCheckPlan">関連図と看護計画の対応</option>
<option value="measurableGoal">評価可能な目標</option><option value="labRanges">検査値の条件</option>
<option value="ocrRisk">OCR誤読候補</option><option value="ruleSuggestion">修正履歴の改善候補</option>
<option value="bibliography">根拠資料の一覧</option><option value="learningStats">学習結果の傾向</option>
</optgroup>
</select>
<p><label for="payload">入力JSON（架空の例のみ）</label><textarea id="payload" spellcheck="false"></textarea></p>
<button id="example" type="button">例を表示</button> <button id="check" type="button">点検する</button> <button id="clear" type="button">内容を消去</button>
<h2>点検結果</h2><pre id="output" role="status" aria-live="polite">まだ点検していません。</pre>
<script src="quality-checks.js"></script><script src="review-plus.js"></script>
<script>'use strict';
const mode=document.getElementById('mode'),payload=document.getElementById('payload'),output=document.getElementById('output');
const cases={
classifyEvidence:{dataType:'S',text:'歩くと足が痛い',tags:['10']},
periodSatisfaction:{beforeAdmission:{status:'satisfied',evidence:'自立'},afterAdmission:{status:'unknown'}},
nursingProblem:{name:'転倒リスク',evidenceIds:[]},
relationMap:{nodes:[{id:'a'},{id:'b'}],edges:[{from:'a',to:'b',relation:'causes'}]},
carePlan:{goal:'',OP:[],TP:[],EP:[]},
lab:{value:9.8,unit:'g/dL',min:12,max:16,source:''},
ocr:{source:'WBC 6000/μL',extracted:'WBC 8000/μL'},
history:[{reason:'日時修正'},{reason:'タグ変更'},{reason:'タグ変更'}],
applicability:{claim:{scope:'成人',status:'pending-expert-review'},context:{ageGroup:'adult',phase:'afterAdmission'}},
traceExtraction:{source:'入院前は自立。',cards:[{id:1,text:'入院前は自立。'}]},
chronology:[{timestamp:'2026-10-10T09:00:00+09:00'},{timestamp:'2026-10-09T09:00:00+09:00'}],
assessNarrative:{evidence:'歩行時ふらつき',interpretation:'転倒につながる可能性'},
contradiction:[{id:'a',metric:'体温',period:'術後',value:37},{id:'b',metric:'体温',period:'術後',value:39}],
problemPriority:{urgency:'high'},
overlappingProblems:[{id:1,problem:'転倒リスク'},{id:2,problem:'転倒リスク'}],
crossCheckPlan:{map:{nodes:[]},plans:[{id:1,problem:'感染リスク'}]},
measurableGoal:'疼痛が改善する',labRanges:{low:12,high:16,unit:'g/dL'},ocrRisk:'WBC 8.O mg',
ruleSuggestion:[{reason:'タグ'},{reason:'タグ'}],bibliography:[{sources:[{url:'https://example.org',title:'例'}]}],
learningStats:[{topic:'呼吸',correct:false},{topic:'循環',correct:true}]
};
document.getElementById('example').onclick=()=>{payload.value=JSON.stringify(cases[mode.value],null,2);output.textContent='例を読み込みました';};
document.getElementById('clear').onclick=()=>{payload.value='';output.textContent='入力を消去しました';};
mode.onchange=()=>{payload.value='';output.textContent='種類を選び直しました';};
document.getElementById('check').onclick=()=>{
try{const data=JSON.parse(payload.value);const key=mode.value;const q=window.NursingQualityChecks;
const ext=window.NursingReviewPlus;
const result=key==='ocr'?q.ocr(data.source,data.extracted):key==='applicability'?q.applicability(data.claim,data.context):
(key==='traceExtraction'?ext.traceExtraction(data.source,data.cards):key==='crossCheckPlan'?ext.crossCheckPlan(data.map,data.plans):
typeof ext[key]==='function'?ext[key](data):q[key](data));
output.textContent=JSON.stringify({warningCount:Array.isArray(result)?result.length:null,results:result},null,2);
}catch(e){output.textContent='入力形式を確認してください: '+e.message;}
};
</script></body></html>

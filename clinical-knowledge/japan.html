<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国内の公式資料｜socode</title><style>body{max-width:850px;margin:auto;padding:16px;font:16px/1.65 system-ui,sans-serif;color:#253242;background:#f8fafc}h1{font-size:1.5rem}article{background:white;border:1px solid #d7dfe9;padding:16px;margin:12px 0;border-radius:10px}a{color:#155d9c}input{font:inherit;box-sizing:border-box;width:100%;padding:10px;border:1px solid #94a3b8;border-radius:8px}small{color:#4b5a6c}h2{font-size:1.08rem}</style></head><body>
<a href="index.html">← 看護知識資料集</a><h1>国内の公式資料</h1><p>日本の看護・医療安全・糖尿病に関する公的・学会資料の参照先です。原文や改訂状況を確認するための索引であり、臨床的な承認済み知識ではありません。</p>
<label for="query">資料を検索</label><input type="search" id="query" placeholder="例：医療安全、糖尿病、看護記録"><p id="status" role="status"></p><div id="result"></div>
<script>'use strict';let items=[];const q=document.getElementById('query'),out=document.getElementById('result'),status=document.getElementById('status');
function render(){const needle=q.value.trim().toLowerCase();const filtered=items.filter(i=>[i.title,i.publisher,...i.topics].join(' ').toLowerCase().includes(needle));out.replaceChildren();for(const item of filtered){const card=document.createElement('article'),h=document.createElement('h2'),a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title;h.append(a);const p=document.createElement('p');p.textContent=item.publisher+'・'+item.year+'年';const note=document.createElement('small');note.textContent=item.notes;card.append(h,p,note);out.append(card);}status.textContent=filtered.length+'件／全'+items.length+'件';}
q.addEventListener('input',render);fetch('./japan-official-sources.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('資料取得エラー');return r.json()}).then(x=>{items=x.items;render()}).catch(()=>{status.textContent='資料の取得に失敗しました。'});</script></body></html>

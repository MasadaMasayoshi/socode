<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看護過程の特別講義｜socode</title><style>body{max-width:920px;margin:auto;padding:16px 16px 60px;font:16px/1.85 system-ui,sans-serif;color:#233042;background:#f8fafc}h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.05rem}article{background:#fff;border:1px solid #d3dce7;border-radius:10px;padding:16px;margin:18px 0}nav{display:flex;gap:10px;flex-wrap:wrap}nav a{padding:9px;border:1px solid #b9c5d5;border-radius:8px}a{color:#125c9c}section{margin:18px 0}aside{padding:12px;border-left:3px solid #64748b;background:#f3f6fa}p{max-width:75ch}@media(max-width:600px){article{padding:12px}h1{font-size:1.35rem}nav a{flex:1 1 45%;text-align:center}}</style></head><body><p><a href="index.html">← 看護知識資料集</a> · <a href="practice.html">確認問題に進む</a></p><h1>看護過程の特別講義</h1><p>情報整理・アセスメント・関連図・看護計画を段階的に理解するための教材です。AIによる臨床判断や患者別の処置提案ではありません。</p><p id="disclaimer"></p><nav id="contents" aria-label="講義の目次"></nav><main id="modules"></main><p id="status" role="status"></p><script>'use strict';
const root=document.getElementById('modules'),links=document.getElementById('contents'),status=document.getElementById('status');
fetch('./learning-modules.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('講義を取得できませんでした');return r.json()}).then(data=>{
  document.getElementById('disclaimer').textContent=data.notice;
  if(!Array.isArray(data.modules))throw Error('講義の形式が不正です');
  for(const lesson of data.modules){
    const anchor=document.createElement('a');anchor.href='#'+lesson.id;anchor.textContent=lesson.title;links.append(anchor);
    const article=document.createElement('article');article.id=lesson.id;
    const h2=document.createElement('h2');h2.textContent=lesson.title;article.append(h2);
    const intro=document.createElement('p');intro.textContent=lesson.intro;article.append(intro);
    for(const part of lesson.sections||[]){const section=document.createElement('section'),h3=document.createElement('h3'),p=document.createElement('p');h3.textContent=part.heading;p.textContent=part.text;section.append(h3,p);article.append(section);}
    const aside=document.createElement('aside'),h3=document.createElement('h3'),p=document.createElement('p');h3.textContent='演習';p.textContent=lesson.exercise;aside.append(h3,p);article.append(aside);root.append(article);
  }
  status.textContent=data.modules.length+'講義を表示しました。';
}).catch(e=>{status.textContent='講義を表示できませんでした。接続状態を確認してください。';});
</script></body></html>
